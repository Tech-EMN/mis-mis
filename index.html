    /* Dark mode palette — only the color system changes; layout and component geometry remain untouched. */
    :root {
      --mis-bg: #BBBBBB;
      --mis-sidebar: #ffffff;
      --mis-card: #ffffff;
      --mis-surface-muted: #f6f7f8;
      --mis-surface-soft: #fafbfb;

      --mis-text-muted: #717780;
      --mis-text-soft: #9aa1a9;
      --mis-text-faint: #d1d5db;
      --mis-nav-active: #02033B;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --mis-bg: #151f2e;
      --mis-sidebar: #192536;
      --mis-card: #202c3d;
      --mis-surface-muted: #263447;
      --mis-surface-soft: #233143;
      --mis-border: rgba(177,199,224,.18);
      --mis-text-strong: #f1f6fc;
      --mis-text-secondary: #d7e1ed;
      --mis-text-muted: #a9b7c8;
      --mis-text-soft: #8292a6;
      --mis-text-faint: #748395;
      --mis-nav-active: #477de5;
    }

const Badge = ({ children, color = 'gray', dot, style }) => {
  const map = {
    gray: { bg: '#F3F4F6', txt: C.t700 },
    green: { bg: C.green100, txt: C.green600 },
    blue: { bg: C.blue100, txt: C.blue600 },
    orange: { bg: C.orange100, txt: C.orange600 },
    red: { bg: C.red100, txt: C.red600 },
    purple: { bg: C.purple100, txt: C.purple600 },
    dark: { bg: '#1C3A2A', txt: '#fff' },
  };
  const cs = map[color] || map.gray;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 5,
      padding: '2px 10px', borderRadius: 20,
      fontSize: 12, fontWeight: 500,
      background: cs.bg, color: cs.txt, ...style,
    }}>
      {dot && <span style={{ width: 6, height: 6, borderRadius: 3, background: cs.txt, display: 'inline-block' }} />}
      {children}
    </span>
  );
};

const Card = ({ children, style, onClick, className = '', ...p }) => (
  <div className={`mis-card${className ? ` ${className}` : ''}`} onClick={onClick} style={{
    background: C.card, borderRadius: 19, border: `1px solid ${C.border}`,
    boxShadow: '0 8px 24px rgba(15,23,42,0.035)',
    cursor: onClick ? 'pointer' : undefined,
    transition: onClick ? 'transform .15s ease, box-shadow .15s ease' : undefined,
    ...style,
  }} {...p}>{children}</div>
);

const ProgressBar = ({ value = 0, color, height = 6, style }) => {
  const col = color || (value >= 80 ? C.green500 : value >= 50 ? C.blue500 : value >= 30 ? C.orange500 : C.red500);
  return (
    <div style={{ background: '#E5E7EB', borderRadius: height, height, overflow: 'hidden', ...style }}>
      <div style={{ width: `${Math.min(100, Math.max(0, value))}%`, height: '100%', background: col, borderRadius: height, transition: 'width 0.4s ease' }} />
    </div>
  );
};

const StatCard = ({ label, value, sub, subColor, icon, style }) => (
  <Card style={{ padding: '20px 24px', ...style }}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
      <div>
        <div style={{ fontSize: 13, color: C.t500, marginBottom: 8 }}>{label}</div>
        <div style={{ fontSize: 34, fontWeight: 700, color: C.t900, lineHeight: 1 }}>{value}</div>
        {sub && <div style={{ marginTop: 10 }}>{sub}</div>}
      </div>
      {icon && <div style={{ color: C.t300 }}>{icon}</div>}
    </div>
  </Card>
);

const Avatar = ({ name = '', size = 36, bg = '#1C3A2A', style }) => {
  const initials = name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const colors = ['#1C3A2A','#1e40af','#7c3aed','#b45309','#0f766e','#9f1239','#374151'];
  const autoBg = colors[name.charCodeAt(0) % colors.length];
  return (
    <div style={{
      width: size, height: size, borderRadius: size,
      background: bg === '#1C3A2A' ? autoBg : bg,
      color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontSize: size * 0.36, fontWeight: 700, flexShrink: 0, ...style,
    }}>{initials || '?'}</div>
  );
};

const Btn = ({ children, variant = 'primary', size = 'md', onClick, style, disabled, icon, type = 'button' }) => {
  const v = {
    primary: { background: '#171717', color: '#fff', border: 'none' },
    secondary: { background: '#fff', color: C.t700, border: `1.5px solid ${C.border}` },
    ghost: { background: 'transparent', color: C.t700, border: 'none' },
    green: { background: C.navActive, color: '#fff', border: 'none' },
    danger: { background: C.red600, color: '#fff', border: 'none' },
    outline: { background: '#fff', color: C.t900, border: `1.5px solid ${C.t900}` },
  };
  const sz = { sm: { padding: '7px 14px', fontSize: 12 }, md: { padding: '10px 20px', fontSize: 13 }, lg: { padding: '13px 28px', fontSize: 15 } };
  return (
    <button type={type} onClick={onClick} disabled={disabled} style={{
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 7,
      borderRadius: 24, cursor: disabled ? 'not-allowed' : 'pointer',
      fontWeight: 650, fontFamily: 'inherit', opacity: disabled ? 0.45 : 1,
      boxShadow: variant === 'primary' ? '0 9px 18px rgba(0,0,0,.10)' : 'none',
      ...v[variant], ...sz[size], ...style,
    }}>{icon}{children}</button>
  );
};

const Input = ({ label, placeholder, type = 'text', value, onChange, style, iconL, iconR, hint }) => (
  <div style={{ display: 'flex', flexDirection: 'column', gap: 5, ...style }}>
    {label && <label style={{ fontSize: 13, fontWeight: 500, color: C.t700 }}>{label}</label>}
    <div style={{ position: 'relative', display: 'flex', alignItems: 'center' }}>
      {iconL && <div style={{ position: 'absolute', left: 12, color: C.t400, display: 'flex' }}>{iconL}</div>}
      <input className="mis-input" type={type} placeholder={placeholder} value={value} onChange={onChange} style={{
        width: '100%', padding: `10px ${iconR ? '38px' : '14px'} 10px ${iconL ? '38px' : '14px'}`,
        border: `1.5px solid ${C.border}`, borderRadius: 10,
        fontSize: 14, color: C.t900, background: '#fff', outline: 'none', fontFamily: 'inherit',
      }} />
      {iconR && <div style={{ position: 'absolute', right: 12, color: C.t400, display: 'flex', cursor: 'pointer' }}>{iconR}</div>}
    </div>
    {hint && <div style={{ fontSize: 12, color: C.t400 }}>{hint}</div>}
  </div>
);

const Divider = ({ label, style }) => (
  <div className="mis-divider" style={{ display: 'flex', alignItems: 'center', gap: 12, ...style }}>
    <div className="mis-divider-line" style={{ flex: 1, height: 1, background: C.border }} />
    {label && <span className="mis-divider-label" style={{ fontSize: 12, color: C.t400, whiteSpace: 'nowrap' }}>{label}</span>}
    <div className="mis-divider-line" style={{ flex: 1, height: 1, background: C.border }} />
  </div>
);

const StatusDot = ({ color = C.green500, size = 8 }) => (

const SectionHeader = ({ title, subtitle, action, style }) => (
  <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 22, ...style }}>

      <h1 style={{ fontSize: 38, fontWeight: 800, color: C.t900, lineHeight: 1.08, letterSpacing: '-1.2px' }}>{title}</h1>

const TabBar = ({ tabs, active, onChange, style }) => (
  <div style={{ display: 'flex', gap: 4, ...style }}>
    {tabs.map(t => {
      const id = t.id || t; const lbl = t.label || t; const isA = active === id;
      return (
        <button key={id} className={`mis-select-btn${isA ? ' active' : ''}`} aria-pressed={isA} onClick={() => onChange(id)} style={{
          padding: '7px 16px', borderRadius: 8, fontSize: 14, fontWeight: 500,
          cursor: 'pointer', border: 'none', fontFamily: 'inherit',
          background: isA ? C.t900 : 'transparent', color: isA ? '#fff' : C.t500, transition: 'all 0.15s',
        }}>{lbl}</button>
      );
    })}
  </div>
);

const ChipBar = ({ chips, active, onChange, style }) => (
  <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', ...style }}>
    {chips.map(c => {
      const id = c.id || c; const lbl = c.label || c; const isA = active === id;
      return (
        <button key={id} className={`mis-select-btn${isA ? ' active' : ''}`} aria-pressed={isA} onClick={() => onChange(id)} style={{
          padding: '5px 14px', borderRadius: 20, fontSize: 13, fontWeight: 500,
          cursor: 'pointer', fontFamily: 'inherit',
          border: isA ? 'none' : `1.5px solid ${C.border}`,
          background: isA ? C.t900 : C.card, color: isA ? '#fff' : C.t700, transition: 'all 0.15s',
        }}>{lbl}</button>
      );
    })}
  </div>
);

const formatProjectBudget = value => {
  const numeric = Number(String(value || '').replace(/\D/g, ''));
  return numeric ? `R$ ${(numeric / 1000000).toFixed(1).replace('.', ',')}M` : 'R$ 4,2M';
};
const projectDaysRemaining = deadline => {
  if (!deadline) return 28;
  const [d, m, y] = String(deadline).split('/').map(Number);
  if (!d || !m || !y) return 28;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.max(0, Math.ceil((new Date(y, m - 1, d) - today) / 86400000));
};

  const label = cta_labels[active] || 'Nova ação';
  React.useEffect(() => {
    const sync = e => setActiveProject(e.detail || readActiveProject());
    window.addEventListener('mis:project-change', sync);
    return () => window.removeEventListener('mis:project-change', sync);
  }, []);
  React.useEffect(() => {
    const onKey = e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setSearchOpen(true); }
      if (e.key === 'Escape') { setSearchOpen(false); setActionOpen(false); }
    };
    const onAction = () => setActionOpen(true);
    window.addEventListener('keydown', onKey);
    window.addEventListener('mis:action', onAction);
    return () => { window.removeEventListener('keydown', onKey); window.removeEventListener('mis:action', onAction); };
  }, []);
  return (
    <>
      <header className="mis-topbar">
        <button className="mis-search-trigger" onClick={() => setSearchOpen(true)}><Ic.Search size={17} color={C.t700} /><span>Buscar obras, tarefas, alertas...</span><kbd>Ctrl K</kbd></button>

        <button className="mis-icon-btn" onClick={() => onNavigate('configuracoes')} aria-label="Configurações"><Ic.Settings size={19} /></button>
        <button className={`mis-icon-btn${dimmed ? ' theme-active' : ''}`} onClick={onToggleDim} aria-label={dimmed ? 'Ativar modo claro' : 'Ativar modo escuro'} title={dimmed ? 'Modo claro' : 'Modo escuro'}><Ic.Moon size={19} /></button>
      </header>
      {searchOpen && <SearchPalette onClose={() => setSearchOpen(false)} onNavigate={onNavigate} />}
      {actionOpen && <ActionDialog active={active} label={label} onClose={() => setActionOpen(false)} onNavigate={s => { setActionOpen(false); onNavigate(s); }} />}
    </>
  );
};

const AppShell = ({ active, onNavigate, children, noPad }) => {
  const [darkMode, setDarkMode] = React.useState(() => {
    try { return localStorage.getItem('mis_theme') === 'dark'; }
    catch (_) { return false; }
  });
  const [activeProject, setActiveProject] = React.useState(readActiveProject());
  React.useEffect(() => {
    const sync = e => setActiveProject(e.detail || readActiveProject());
    window.addEventListener('mis:project-change', sync);
    return () => window.removeEventListener('mis:project-change', sync);
  }, []);
  React.useEffect(() => {
    const theme = darkMode ? 'dark' : 'light';
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem('mis_theme', theme); } catch (_) {}
  }, [darkMode]);
  const showProjectWorkspace = !!activeProject && PROJECT_CONTEXTUAL_SCREENS.has(active);
  const showNewProjectFlow = NEW_PROJECT_FLOW_SCREENS.has(active);
  return (
    <div className={`mis-app${darkMode ? ' dark-mode' : ''}`}>
      <Sidebar active={active} onNavigate={onNavigate} />
      <div className="mis-main-shell">
        <TopBar active={active} onNavigate={onNavigate} dimmed={darkMode} onToggleDim={() => setDarkMode(v => !v)} />
        <main className={`mis-page-scroll${noPad ? ' no-pad' : ''} page-${active}`}>
          {showProjectWorkspace && <div className="project-context-wrap"><ProjectWorkspaceDropdown active={active} project={activeProject} onNavigate={onNavigate} /></div>}
          {showNewProjectFlow && <NewProjectFlowNav active={active} onNavigate={onNavigate} />}
          {children}
        </main>
      </div>
    </div>
  );
};

Object.assign(window, { NAV_ITEMS, PROJECT_WORKSPACE_GROUPS, ProjectWorkspaceDropdown, NewProjectFlowNav, Sidebar, TopBar, AppShell });

// ─── Circular Progress ────────────────────────────────────────────────────────
const CircProg = ({ value, size = 56, color, stroke = 3.5 }) => {
  const col = color || (value >= 70 ? C.green500 : value >= 50 ? C.blue500 : C.orange500);
  const r = (size - stroke * 2) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ - (value / 100) * circ;
  return (
    <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#E5E7EB" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth={stroke}
          strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"/>
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <span style={{ fontSize: Math.round(size * 0.24), fontWeight: 700, color: col, lineHeight: 1 }}>{value}%</span>
      </div>
    </div>
  );
};

  const saldos = dados.map(d => d.saldo);

  const isDark = typeof document !== 'undefined' && document.documentElement.dataset.theme === 'dark';

  const chartAreaColor = isDark ? `${C.blue500}15` : 'rgba(47,111,255,.18)';

  const chartDotStroke = chartLineColor;

  return (

          { label: 'Mín. Projetado',  value: 'R$ 302k', color: C.orange600},
          { label: 'Máx. Projetado',  value: 'R$ 363k', color: C.green600 },
          { label: 'Saldo 30d',       value: 'R$ 331k', color: C.blue600  },
        ].map(k => (
          <Card key={k.label} style={{ padding: '16px 20px' }}>
            <div style={{ fontSize: 12, color: C.t500, marginBottom: 6 }}>{k.label}</div>
            <div style={{ fontSize: 26, fontWeight: 700, color: k.color }}>{k.value}</div>
          </Card>
        ))}
      </div>

      <Card style={{ padding: '20px 24px', marginBottom: 14 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
          <span style={{ fontSize: 15, fontWeight: 600, color: C.t900 }}>Saldo Projetado — Junho 2025</span>
          <TabBar tabs={[{id:'semana',label:'Semana'},{id:'mes',label:'Mês'},{id:'trimestre',label:'Trimestre'}]}
            active={periodo} onChange={setPeriodo}/>
        </div>

        {/* SVG Line chart */}
        <div style={{ overflowX: 'auto' }}>
          <svg viewBox={`-10 -10 ${W+20} ${H+30}`} style={{ width: '100%', minWidth: 400, height: 160 }}>
            {/* Grid lines */}
            {[0,0.25,0.5,0.75,1].map(t => (
              <line key={t} x1={0} x2={W} y1={H - t*H} y2={H - t*H} stroke={chartGridColor} strokeWidth={1.2}/>
            ))}
            {/* Area fill */}
            <polygon points={`0,${H} ${pts} ${W},${H}`} fill={chartAreaColor}/>
            {/* Line */}
            <polyline points={pts} fill="none" stroke={chartLineColor} strokeWidth={2.75} strokeLinecap="round" strokeLinejoin="round"/>
            {/* Dots */}
            {saldos.map((s,i) => (
              <circle key={i} cx={(i/(saldos.length-1))*W} cy={H-((s-minS)/range)*H} r={4.5} fill={chartDotFill} stroke={chartDotStroke} strokeWidth={2.25}/>

            {/* X labels */}
            {dados.map((d,i) => (
              <text key={i} x={(i/(saldos.length-1))*W} y={H+20} textAnchor="middle" fontSize={11} fill={chartLabelColor}>{d.data}</text>
            ))}
          </svg>
        </div>
      </Card>

      {/* Alert período negativo */}
      <Card style={{ padding: '14px 18px', background: C.orange100, border: `1px solid ${C.orange500}30`, marginBottom: 14 }}>

        <table style={{ width: '100%', fontSize: 14 }}>
          <thead>

  );
};

const Root = () => {
  const getInitial = () => {
    const hash = window.location.hash.replace(/^#\/?/, '');

    // A rota explícita na URL continua funcionando. Sem rota, o protótipo sempre
    // abre na carteira de projetos, evitando restaurar uma tela operacional isolada
    // salva por uma execução anterior no localStorage.
    const candidate = hash && SCREEN_MAP[hash] ? hash : 'projetos';
    const next = PROJECT_SCOPED_SCREENS.has(candidate) && !readActiveProject() ? 'projetos' : candidate;

    if (!hash) {
      localStorage.setItem('mis_screen', next);
      window.history.replaceState(null, '', `#${next}`);
    }
    return next;
  };
  const [screen, setScreen] = React.useState(getInitial);
  React.useEffect(() => {
    const syncHash = () => {
      let next = window.location.hash.replace(/^#\/?/, '');
      if (!next || !SCREEN_MAP[next]) {
        next = 'projetos';
        window.history.replaceState(null, '', '#projetos');
      }
      if (PROJECT_SCOPED_SCREENS.has(next) && !readActiveProject()) {
        next = 'projetos';
        if (window.location.hash !== '#projetos') window.history.replaceState(null, '', '#projetos');
      }
      setScreen(next);
    };
    window.addEventListener('hashchange', syncHash);
    return () => window.removeEventListener('hashchange', syncHash);
  }, []);
  const navigate = (s) => {
    if (!SCREEN_MAP[s]) return;
    if (PROJECT_SCOPED_SCREENS.has(s) && !readActiveProject()) s = 'projetos';
    setScreen(s);
    const nonPersistentScreens = new Set(['atividades', 'dashboard_uc', 'aprovacao']);
    localStorage.setItem('mis_screen', nonPersistentScreens.has(s) ? 'projetos' : s);
    if (window.location.hash !== `#${s}`) window.location.hash = s;
    const scroller = document.querySelector('.mis-page-scroll');
    if (scroller) scroller.scrollTo({ top: 0, behavior: 'auto' });
  };
  const ScreenComponent = SCREEN_MAP[screen];
  return ScreenComponent ? <ScreenComponent onNavigate={navigate} /> : (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: C.bg }}>
      <div style={{ textAlign: 'center' }}><div style={{ fontSize: 16, color: C.t500, marginBottom: 16 }}>Tela &quot;{screen}&quot; não encontrada</div><Btn onClick={() => navigate('login')}>Voltar ao início</Btn></div>
    </div>
  );
};

const rootEl = document.getElementById('root');
const reactRoot = ReactDOM.createRoot(rootEl);
reactRoot.render(<Root />);

  
  </script>
</body>
</html>
