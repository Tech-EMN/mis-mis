  <!-- Fix: React 18 createRoot() polyfill for UMD development build -->
  <script>
    (function() {
      var testDiv = document.createElement('div');
      try {
        var testRoot = ReactDOM.createRoot(testDiv);
        testRoot.render(React.createElement('div', null, 'polyfill-test'));
        if (testDiv.innerHTML.indexOf('polyfill-test') !== -1) return;
      } catch(e) {}
      ReactDOM.createRoot = function(container) {
        return {
          render: function(el) { ReactDOM.render(el, container); },
          unmount: function() { ReactDOM.unmountComponentAtNode(container); },
          _internalRoot: null
        };
      };
    })();
  </script>


  <!-- === Tema inicial (antes do primeiro render, evita flash) === -->
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('mis_theme') === 'dark' ? 'dark' : 'light';
    } catch (_) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
